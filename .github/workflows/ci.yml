name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: pg_dump --version && pg_restore --version   # used by test/ops.test.ts (backup and restore)
      - run: npm test
      - run: npm run rpx -- app check examples/emp/app.yaml
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/report

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose up (local install path from docs/install-lokal.md)
        run: |
          printf 'RPX_SECRET=%s\nRPX_DEMO_PASSWORD=ci-demo-pass-123\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 2; done
          curl -fsS http://localhost:8080/r/demo/emp/login | grep -q 'Nama pengguna'
          curl -fsS http://localhost:8080/r/pandawa/demo/login | grep -q 'Nama pengguna'
          docker compose logs setup
      - name: backup and restore (docs/operasional.md)
        run: |
          docker compose run --rm rpx backup --keep 14
          ls -l backups
          docker compose run --rm rpx restore "$(ls backups/*.dump | tail -1)" --to rpx_restore | tee restore.log
          grep -q 'restore selesai ke database "rpx_restore": 2 workspace, 2 aplikasi' restore.log
          docker compose run --rm rpx session purge
      - if: failure()
        run: docker compose logs
