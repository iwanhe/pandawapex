# Instalasi lokal tanpa SSO: PostgreSQL + engine + data contoh.
#   1. cp .env.example .env   lalu isi RPX_SECRET dan RPX_DEMO_PASSWORD
#   2. docker compose up -d --build
#   3. buka http://localhost:8080/r/demo/emp   (user: RPX_DEMO_USER, default "admin")
name: pandawapex

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-lokal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"     # hanya dari komputer ini; port 55432 agar tidak bentrok dengan PostgreSQL lain
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rpx"]
      interval: 3s
      timeout: 3s
      retries: 20

  setup:
    build: .
    # aplikasi contoh emp (/r/demo/emp) dan pilot DEMO Permintaan Barang (/r/pandawa/demo)
    command: ["sh", "-c", "node src/cli/rpx.ts demo setup && node src/cli/rpx.ts pilot setup"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres-lokal}@db:5432/rpx
      RPX_DEMO_USER: ${RPX_DEMO_USER:-admin}
      RPX_DEMO_PASSWORD: ${RPX_DEMO_PASSWORD:?isi RPX_DEMO_PASSWORD di file .env (minimal 10 karakter)}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Perintah admin (CLI). Tidak ikut "up"; dijalankan saat perlu:
  #   docker compose run --rm rpx backup --keep 14
  #   docker compose run --rm rpx restore backups/<file>.dump --to rpx_restore
  #   docker compose run --rm rpx ws create latihan --schema latihan_app
  rpx:
    build: .
    profiles: ["tools"]
    user: root                         # agar bisa menulis ke folder ./backups milik siapa pun di host
    entrypoint: ["node", "src/cli/rpx.ts"]
    command: ["--help"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres-lokal}@db:5432/rpx
      RPX_DEMO_USER: ${RPX_DEMO_USER:-admin}
      RPX_DEMO_PASSWORD: ${RPX_DEMO_PASSWORD:-}
    volumes:
      - ./backups:/app/backups         # hasil "backup" muncul di folder backups di samping file ini
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      RPX_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres-lokal}@db:5432/rpx
      RPX_SECRET: ${RPX_SECRET:?isi RPX_SECRET di file .env (openssl rand -hex 32)}
      PORT: 8080
      RPX_PURGE_MINUTES: ${RPX_PURGE_MINUTES:-}
      # kosong = bawaan; untuk demo publik lihat docs/cloudflare-local-demo.md
      RPX_SECURE_COOKIES: ${RPX_SECURE_COOKIES:-}
      RPX_TRUST_PROXY: ${RPX_TRUST_PROXY:-}
      RPX_BUILDER_HOSTS: ${RPX_BUILDER_HOSTS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
