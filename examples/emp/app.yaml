# Aplikasi contoh: daftar karyawan + form ubah/tambah/hapus.
# Import: npm run rpx -- app import examples/emp/app.yaml --ws demo
app: emp
name: Data Karyawan
version: "0.1"
parsing_schema: demo_app
home_page: 1
timezone: Asia/Jakarta
substitutions:
  COMPANY: KCSI

# Hanya anggota grup SDM (dari akun lokal atau klaim grup SSO) yang boleh menambah/mengubah data.
authorization:
  - name: pengelola_sdm
    type: group_member
    source: SDM
    error_msg: Halaman ini hanya untuk tim SDM.

application_items:
  - { name: AI_MASUK_SEJAK }

computations:
  - item: AI_MASUK_SEJAK
    point: after_authentication
    type: sql_expression
    expression: "to_char(now(), 'DD-MM-YYYY HH24:MI')"

# Daftar pilihan bersama: dipakai beberapa item lewat namanya.
lovs:
  DEPARTEMEN:
    sql: select nama as d, deptno as r from departemen order by nama
  STATUS_KERJA:
    static:
      - { display: Tetap, return: TETAP }
      - { display: Kontrak, return: KONTRAK }
      - { display: Magang, return: MAGANG }
  KEAHLIAN:
    static:
      - { display: SQL, return: SQL }
      - { display: APEX, return: APEX }
      - { display: Gudang, return: GDG }
      - { display: K3, return: K3 }

navigation:
  - { label: Karyawan, icon: users, page: 1 }
  - { label: Mutasi, icon: pencil, page: 4, authorization: pengelola_sdm }
  - { label: Tentang aplikasi, icon: info, page: 3 }

pages:
  - page: 1
    alias: karyawan
    name: Karyawan
    regions:
      - static_id: daftar
        title: Daftar karyawan
        type: interactive_report
        page_size: 5
        empty_text: Belum ada karyawan. Tambahkan dengan tombol "Tambah karyawan".
        source:
          sql: |
            select k.empno, k.nama, k.jabatan, d.nama as departemen, k.tgl_masuk, k.gaji
                 , case when k.aktif then 'Aktif' else 'Nonaktif' end as status
            from karyawan k
            left join departemen d on d.deptno = k.deptno
            order by k.nama
        columns:
          - { name: EMPNO, label: "No.", is_pk: true, data_type: number, link: { page: 2, items: { P2_EMPNO: "#EMPNO#" }, clear_cache: "2" } }
          - { name: NAMA, label: Nama }
          - { name: JABATAN, label: Jabatan }
          - { name: DEPARTEMEN, label: Departemen }
          - { name: TGL_MASUK, label: Tanggal masuk, data_type: date, format: date }
          - { name: GAJI, label: Gaji (Rp), data_type: number, format: integer }
          - { name: STATUS, label: Status }
        buttons:
          - { name: TAMBAH, label: Tambah karyawan, hot: true, action: redirect, position: header, target: { page: 2, clear_cache: "2" }, authorization: pengelola_sdm }

  - page: 2
    alias: karyawan-form
    name: Form karyawan
    breadcrumb_parent: 1
    authorization: pengelola_sdm
    mode: modal                   # dibuka sebagai dialog di atas daftar; tanpa JS tetap terbuka sebagai halaman
    dialog_size: md
    regions:
      - static_id: form
        title: Data karyawan
        type: form
        source: { table: karyawan }
        items:
          - { name: P2_EMPNO, type: hidden, source: { column: empno, pk: true } }
          - { name: P2_NAMA, type: text, label: Nama lengkap, required: true, col_span: 6, max_length: 120, source: { column: nama } }
          - { name: P2_JABATAN, type: text, label: Jabatan, col_span: 6, source: { column: jabatan } }
          - name: P2_DEPTNO
            type: select
            label: Departemen
            col_span: 6
            source: { column: deptno }
            lov: DEPARTEMEN
            null_display: "- Pilih departemen -"
          - { name: P2_TGL_MASUK, type: date, label: Tanggal masuk, required: true, col_span: 6, source: { column: tgl_masuk } }
          - { name: P2_GAJI, type: number, label: Gaji per bulan (Rp), required: true, col_span: 6, help: Angka tanpa titik pemisah ribuan., source: { column: gaji } }
          - { name: P2_AKTIF, type: switch, label: Aktif, col_span: 6, default: "Y", source: { column: aktif } }
          - { name: P2_STATUS_KERJA, type: radio, label: Status kerja, lov: STATUS_KERJA, inline: true, required: true, default: TETAP, col_span: 6, source: { column: status_kerja } }
          - { name: P2_KEAHLIAN, type: checkbox_group, label: Keahlian, lov: KEAHLIAN, inline: true, col_span: 12, source: { column: keahlian } }
          - { name: P2_MASA_KERJA, type: display_only, label: Masa kerja, col_span: 6, condition: { item_not_null: P2_EMPNO } }
        buttons:
          - { name: BATAL, label: Batal, action: close_dialog, style: ghost }
          - { name: HAPUS, label: Hapus, style: danger, confirm: "Hapus data karyawan ini?", condition: { item_not_null: P2_EMPNO } }
          - { name: SIMPAN, label: Simpan, hot: true }
    validations:
      - name: gaji_positif
        type: sql_expression
        expression: ":P2_GAJI::numeric > 0"
        error_msg: Gaji harus lebih dari 0.
        item: P2_GAJI
        when_button: SIMPAN
      - name: tgl_tidak_di_masa_depan
        type: sql_expression
        expression: ":P2_TGL_MASUK::date <= current_date"
        error_msg: Tanggal masuk tidak boleh di masa depan.
        item: P2_TGL_MASUK
        when_button: SIMPAN
    computations:
      - item: P2_MASA_KERJA
        type: sql_expression
        expression: "case when :P2_TGL_MASUK is null then null else extract(year from age(current_date, :P2_TGL_MASUK::date))::int || ' tahun' end"
    processes:
      - { name: ambil_data, type: form_init, region: form }
      - { name: simpan_data, type: form_dml, region: form, success_msg: "Data karyawan &P2_NAMA. tersimpan." }
      - { name: tutup, type: close_dialog }
    branches:
      - { page: 1 }

  - page: 3
    alias: tentang
    name: Tentang aplikasi
    regions:
      - static_id: info
        title: Tentang
        type: static
        source:
          html: |
            <p>Aplikasi contoh untuk &COMPANY.: daftar dan form karyawan.</p>
            <p>Anda masuk sebagai <strong>&APP_USER.</strong> sejak &AI_MASUK_SEJAK..</p>

  - page: 4
    alias: mutasi
    name: Mutasi karyawan
    authorization: pengelola_sdm
    regions:
      - static_id: mutasi
        title: Mutasi jabatan
        type: static
        items:
          - name: P4_DEPT_ASAL
            type: select
            label: Departemen asal
            col_span: 6
            lov: DEPARTEMEN
            null_display: "- Semua departemen -"
          # daftar karyawan dimuat ulang setiap kali departemen asal berubah
          - name: P4_EMPNO
            type: popup_lov
            label: Karyawan
            required: true
            col_span: 6
            cascade: [P4_DEPT_ASAL]
            lov:
              sql: |
                select nama || ' (' || coalesce(jabatan, '-') || ')' as d, empno as r
                from karyawan
                where aktif and (:P4_DEPT_ASAL is null or deptno = :P4_DEPT_ASAL::int)
                order by nama
          - { name: P4_DEPT_TUJUAN, type: radio, label: Departemen tujuan, required: true, col_span: 6, lov: DEPARTEMEN }
          - name: P4_JABATAN_BARU
            type: select
            label: Jabatan baru
            required: true
            col_span: 6
            cascade: [P4_DEPT_TUJUAN]
            null_display: "- Pilih jabatan -"
            lov:
              sql: select nama as d, nama as r from jabatan where deptno = :P4_DEPT_TUJUAN::int order by nama
          - { name: P4_BERLAKU, type: datetime, label: Berlaku mulai, required: true, col_span: 6 }
          - { name: P4_STATUS, type: radio, label: Status kerja, lov: STATUS_KERJA, inline: true, required: true, default: TETAP, col_span: 6 }
          - { name: P4_KEAHLIAN, type: checkbox_group, label: Keahlian, lov: KEAHLIAN, inline: true }
          - { name: P4_SETUJU, type: checkbox, label: Atasan langsung sudah menyetujui mutasi ini, required: true }
        buttons:
          - { name: PROSES, label: Proses mutasi, hot: true }
    validations:
      - name: jabatan_berubah
        type: fn_returns_error
        item: P4_JABATAN_BARU
        when_button: PROSES
        expression: |
          declare
             l_nama text;
          begin
             select nama into l_nama from karyawan
             where empno = :P4_EMPNO::int and deptno = :P4_DEPT_TUJUAN::int and jabatan = :P4_JABATAN_BARU;
             if found then
                return l_nama || ' sudah menjabat ' || :P4_JABATAN_BARU || ' di departemen itu.';
             end if;
             return null;
          end;
      - name: berlaku_tidak_lampau
        type: fn_boolean
        item: P4_BERLAKU
        when_button: PROSES
        expression: "return :P4_BERLAKU::timestamp >= date_trunc('day', localtimestamp);"
        error_msg: Tanggal berlaku tidak boleh sebelum hari ini.
    processes:
      - name: mutasi
        type: plpgsql
        when_button: PROSES
        code: |
          update karyawan
             set deptno = :P4_DEPT_TUJUAN::int, jabatan = :P4_JABATAN_BARU
               , status_kerja = :P4_STATUS, keahlian = coalesce(:P4_KEAHLIAN, keahlian)
           where empno = :P4_EMPNO::int;
        success_msg: Mutasi karyawan tercatat.
      - { name: bersihkan, type: clear_cache }
    branches:
      - { page: 1 }
